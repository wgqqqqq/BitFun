[package]
name = "openbitfun-page-function-runtime"
version = "1.0.2"
authors = ["OpenBitFun Team"]
edition = "2021"
description = "Embedded JS Page Function runtime for OpenBitFun Pages (rquickjs)"

[lib]
name = "openbitfun_page_function_runtime"
path = "src/lib.rs"

[dependencies]
# Versions stay explicit so the crate can build inside the standalone relay Docker context.
rquickjs = { version = "0.9", default-features = false, features = ["classes", "properties", "macro"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

# rquickjs 0.9 does not ship pre-generated OHOS bindings. Generate them from
# the target SDK instead of disabling Page Functions on HarmonyOS PC.
[target.'cfg(target_env = "ohos")'.dependencies]
rquickjs = { version = "0.9", default-features = false, features = ["bindgen"] }
