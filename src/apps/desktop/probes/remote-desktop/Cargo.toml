[package]
name = "openbitfun-native-media-probe"
version = "0.1.0"
edition = "2021"
publish = false

# Isolated risk probe; no dependency or feature changes to the shipping product.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
libwebrtc = { version = "=0.3.52", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"

[profile.dev]
debug = 1
