name: macOS Notary Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      OPENBITFUN_REQUIRE_APPLE_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Configure Apple Developer ID signing and notarization
        shell: bash
        run: bash scripts/ci/setup-macos-signing.sh

      - name: Create signed probe application
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="${RUNNER_TEMP}/openbitfun-notary-probe"
          app_dir="${probe_dir}/NotaryProbe.app"
          mkdir -p "${app_dir}/Contents/MacOS"
          cat >"${app_dir}/Contents/MacOS/notary-probe" <<'EOF'
          #!/bin/sh
          exit 0
          EOF
          chmod 755 "${app_dir}/Contents/MacOS/notary-probe"
          cat >"${app_dir}/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>notary-probe</string>
            <key>CFBundleIdentifier</key>
            <string>com.openbitfun.notary-probe</string>
            <key>CFBundleName</key>
            <string>NotaryProbe</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
          </dict>
          </plist>
          EOF
          codesign --force --options runtime --timestamp --sign "${APPLE_SIGNING_IDENTITY}" "${app_dir}"
          ditto -c -k --keepParent "${app_dir}" "${probe_dir}/NotaryProbe.zip"

      - name: Submit probe to Apple notarization
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool submit "${RUNNER_TEMP}/openbitfun-notary-probe/NotaryProbe.zip" \
            --issuer "${APPLE_API_ISSUER}" \
            --key-id "${APPLE_API_KEY}" \
            --key "${APPLE_API_KEY_PATH}" \
            --wait \
            --output-format json
