# Fork-only packaging validation; never publishes a release.
name: Windows Certum Packaging Test
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (stable: v1.0.0-beta or v1.0.0, beta: v1.0.0-beta.1)."
        required: false
        type: string
      checkout_ref:
        description: Commit, branch, or tag to build. Defaults to tag_name, then HEAD.
        required: false
        type: string
      release_channel:
        description: Immutable update channel compiled into the Desktop artifact.
        required: false
        default: stable
        type: choice
        options:
          - stable
          - beta
      upload_to_release:
        description: Upload built artifacts to the release specified by tag_name.
        required: false
        default: false
        type: boolean
      relay_image_only:
        description: Publish only the Relay Server image and signed descriptor (no Desktop packages).
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: desktop-package-${{ (github.event.release.prerelease || inputs.release_channel == 'beta') && 'beta' || github.event.release.tag_name || inputs.tag_name || github.sha }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'data-migrator-v')
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      upload_to_release: ${{ steps.meta.outputs.upload_to_release }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      release_channel: ${{ steps.meta.outputs.release_channel }}
      relay_image_only: ${{ steps.meta.outputs.relay_image_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve version metadata
        id: meta
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_CHECKOUT_REF: ${{ inputs.checkout_ref }}
          INPUT_RELEASE_CHANNEL: ${{ inputs.release_channel }}
          INPUT_UPLOAD_TO_RELEASE: ${{ inputs.upload_to_release }}
          INPUT_RELAY_IMAGE_ONLY: ${{ inputs.relay_image_only }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${RELEASE_TAG_NAME}"
            VERSION="${TAG#v}"
            UPLOAD="true"
            CHECKOUT_REF="${TAG}"
            if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          elif [[ -n "${INPUT_TAG_NAME}" ]]; then
            TAG="${INPUT_TAG_NAME}"
            VERSION="${TAG#v}"
            CHANNEL="${INPUT_RELEASE_CHANNEL:-stable}"
            # Image-only rebuilds use the same immutable source tag as their
            # archives. Using the workflow branch breaks the tag/SHA guard and
            # can combine a new Dockerfile with unrelated release binaries.
            if [[ -n "${INPUT_CHECKOUT_REF}" ]]; then
              CHECKOUT_REF="${INPUT_CHECKOUT_REF}"
            else
              CHECKOUT_REF="${TAG}"
            fi
            if [[ "${INPUT_UPLOAD_TO_RELEASE}" == "true" ]]; then
              UPLOAD="true"
            else
              UPLOAD="false"
            fi
          else
            VERSION="$(jq -r '.version' package.json)"
            TAG="v${VERSION}"
            UPLOAD="false"
            CHECKOUT_REF="${GITHUB_SHA}"
            CHANNEL="${INPUT_RELEASE_CHANNEL:-stable}"
          fi

          node --input-type=module -e \
            "import { validateReleaseVersion } from './scripts/release-channel.mjs'; validateReleaseVersion(process.argv[1], process.argv[2]);" \
            "${CHANNEL}" "${VERSION}"

          git fetch origin main --tags --force
          CHECKOUT_SHA="$(git rev-parse "${CHECKOUT_REF}^{commit}")"
          if [[ "${GITHUB_REPOSITORY}" == "GCWing/OpenBitFun" ]] && \
             ! git merge-base --is-ancestor "${CHECKOUT_SHA}" origin/main; then
            echo "Ref ${CHECKOUT_REF} (${CHECKOUT_SHA}) is not part of the protected main history." >&2
            exit 1
          fi
          TAG_SHA="$(git rev-parse --verify --quiet "${TAG}^{commit}" || true)"
          if [[ -n "${TAG_SHA}" && "${TAG_SHA}" != "${CHECKOUT_SHA}" ]]; then
            echo "Existing tag ${TAG} points to ${TAG_SHA}, not requested commit ${CHECKOUT_SHA}." >&2
            exit 1
          fi
          if [[ "${UPLOAD}" == "true" && -z "${TAG_SHA}" ]]; then
            echo "Publishing requires existing tag ${TAG} at ${CHECKOUT_SHA}. Push the tag before dispatching." >&2
            exit 1
          fi
          CHECKOUT_REF="${CHECKOUT_SHA}"

          echo "version=$VERSION"          >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "upload_to_release=$UPLOAD" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "release_channel=$CHANNEL"  >> "$GITHUB_OUTPUT"
          echo "relay_image_only=${INPUT_RELAY_IMAGE_ONLY:-false}" >> "$GITHUB_OUTPUT"
  package:
    name: Package (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    needs: prepare
    if: needs.prepare.outputs.relay_image_only != 'true'
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      OPENBITFUN_ENABLE_UPDATER_ARTIFACTS: "true"
      OPENBITFUN_RELEASE_CHANNEL: ${{ needs.prepare.outputs.release_channel }}
      TAURI_UPDATER_ENDPOINT: ${{ github.repository != 'GCWing/OpenBitFun' && (needs.prepare.outputs.release_channel == 'beta' && format('https://github.com/{0}/releases/download/channel-v1-beta/latest-v1.json', github.repository) || format('https://github.com/{0}/releases/latest/download/latest-v1.json', github.repository)) || '' }}
      TAURI_UPDATER_FALLBACK_ENDPOINT: ${{ github.repository != 'GCWing/OpenBitFun' && (needs.prepare.outputs.release_channel == 'beta' && format('https://github.com/{0}/releases/download/channel-v1-beta/latest-v1.json', github.repository) || format('https://github.com/{0}/releases/latest/download/latest-v1.json', github.repository)) || '' }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      OPENBITFUN_RELEASE_PUBKEY: ${{ secrets.OPENBITFUN_RELEASE_PUBKEY || secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
            build_command: node scripts/desktop-tauri-build.mjs --no-bundle --target x86_64-pc-windows-msvc --verbose
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Check Windows signing configuration
        if: runner.os == 'Windows'
        id: windows-signing
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
          REQUIRE_SIGNING: ${{ needs.prepare.outputs.upload_to_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @('CERTUM_USERNAME', 'CERTUM_OTP_URI', 'CERTUM_KEY_ID')
          $missing = @($names | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -eq 3 -and $env:REQUIRE_SIGNING -ne 'true') {
            'enabled=false' >> $env:GITHUB_OUTPUT
            Write-Host 'Artifact-only build without Authenticode signing; Certum secrets are not configured.'
          } elseif ($missing.Count -gt 0) {
            throw "Missing Windows signing secrets: $($missing -join ', '). Release publication requires Authenticode signing."
          } else {
            $thumbprint = ($env:CERTUM_KEY_ID -replace '\s', '').ToUpperInvariant()
            if ($thumbprint -notmatch '^[0-9A-F]{40}$') { throw 'CERTUM_KEY_ID must be a SHA-1 certificate fingerprint.' }
            if (-not $env:CERTUM_OTP_URI.StartsWith('otpauth://totp/')) { throw 'CERTUM_OTP_URI must be a TOTP otpauth URI.' }
            'enabled=true' >> $env:GITHUB_OUTPUT
            "WINDOWS_CERTIFICATE_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
          }
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis -y --no-progress
          $nsisRoot = "${env:ProgramFiles(x86)}\NSIS"
          $nsisBin = "${env:ProgramFiles(x86)}\NSIS\Bin"
          if (Test-Path $nsisRoot) {
            Add-Content $env:GITHUB_PATH $nsisRoot
          }
          if (Test-Path $nsisBin) {
            Add-Content $env:GITHUB_PATH $nsisBin
          }
      - name: Verify NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          where.exe makensis
          makensis /VERSION
      - name: Install Linux system dependencies (Tauri bundler)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update

          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            WEBKIT_PKG=libwebkit2gtk-4.1-dev
          else
            WEBKIT_PKG=libwebkit2gtk-4.0-dev
          fi

          if apt-cache show libappindicator3-dev >/dev/null 2>&1; then
            APPINDICATOR_PKG=libappindicator3-dev
          else
            APPINDICATOR_PKG=libayatana-appindicator3-dev
          fi

          # Tauri pins AppImage GTK input methods to its bundled cache, so the
          # fcitx5 GTK3 bridge must be present before linuxdeploy builds it.
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            xdg-utils \
            libglib2.0-dev \
            libgtk-3-dev \
            fcitx5-frontend-gtk3 \
            libxdo-dev \
            "$WEBKIT_PKG" \
            "$APPINDICATOR_PKG" \
            librsvg2-dev \
            patchelf \
            fakeroot \
            rpm \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            tesseract-ocr-eng
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          shared-key: package-v2-${{ matrix.platform.name }}
          cache-bin: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure Apple Developer ID signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          OPENBITFUN_REQUIRE_APPLE_SIGNING: ${{ needs.prepare.outputs.upload_to_release }}
        run: bash scripts/ci/setup-macos-signing.sh
      - name: Project beta build version
        if: needs.prepare.outputs.release_channel == 'beta'
        run: node scripts/set-build-version.mjs --version "${{ needs.prepare.outputs.version }}"
      - name: Verify release version metadata
        run: node scripts/verify-release-version-sync.mjs --version "${{ needs.prepare.outputs.version }}"
      - name: Download and verify target Flashgrep binary
        run: node scripts/prepare-flashgrep-resource.mjs --target "${{ matrix.platform.target }}"
      - name: Build desktop app
        run: ${{ matrix.platform.build_command }}
      - name: Connect Certum SimplySign
        if: runner.os == 'Windows' && steps.windows-signing.outputs.enabled == 'true'
        timeout-minutes: 10
        uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ env.WINDOWS_CERTIFICATE_THUMBPRINT }}
          capture-diagnostics: "false"
      - name: Bundle Windows updater and verify Authenticode
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/desktop-tauri-build.mjs --bundle-only --target x86_64-pc-windows-msvc --bundles nsis --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            # Tauri restores the unsigned raw EXE after bundling; sign it again
            # before the custom installer snapshots and hashes its payload.
            & ./scripts/ci/sign-windows.ps1 -Path 'target/x86_64-pc-windows-msvc/release/openbitfun-desktop.exe'
            $installers = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' -File)
            if ($installers.Count -eq 0) { throw 'NSIS installer was not produced.' }
            foreach ($installer in $installers) {
              & ./scripts/ci/sign-windows.ps1 -Path $installer.FullName -VerifyOnly
            }
          }
      - name: Build and sign custom Windows installer
        if: runner.os == 'Windows'
        timeout-minutes: 60
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The payload manifest must hash the already signed desktop executable.
          $env:OPENBITFUN_INSTALLER_APP_EXE = 'target/x86_64-pc-windows-msvc/release/openbitfun-desktop.exe'
          pnpm run installer:build:only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            & ./scripts/ci/sign-windows.ps1 -Path 'OpenBitFun-Installer/src-tauri/target/release/openbitfun-installer.exe'
          }
      - name: Verify Apple signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci/verify-macos-signing.sh "${{ matrix.platform.target }}"
      - name: Verify AppImage fcitx5 GTK module
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/verify-appimage-fcitx.sh "${{ matrix.platform.target }}"
      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: openbitfun-${{ needs.prepare.outputs.release_tag }}-${{ matrix.platform.name }}-bundle
          if-no-files-found: error
          path: |
            target/*/release/bundle
            target/release/bundle
            src/apps/desktop/target/release/bundle
            OpenBitFun-Installer/src-tauri/target/release/openbitfun-installer.exe
      - name: Verify updater signature artifacts
        shell: pwsh
        run: |-
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' -File)
          if ($installers.Count -eq 0) { throw 'NSIS installer missing.' }
          foreach ($installer in $installers) {
            $sig = "$($installer.FullName).sig"
            if (-not (Test-Path $sig)) { throw "Missing updater signature: $sig" }
            if ((Get-Item $sig).Length -eq 0) { throw "Empty updater signature: $sig" }
          }
          Write-Host 'Windows packages and Tauri updater signatures were produced. Authenticode requires Certum credentials.'
    timeout-minutes: 180
