name: Verify Certum Build Artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  authenticode:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          run-id: 34578102488
          github-token: ${{ github.token }}
          name: openbitfun-v1.0.0-beta.2972-windows-x64-bundle
          path: artifacts
      - name: Verify downloaded Windows installers
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: 15F48E66E0E7324D0B9AB73EB47F8C21366AB947
        run: |
          $ErrorActionPreference = 'Stop'
          $custom = @(Get-ChildItem artifacts -Recurse -File -Filter openbitfun-installer.exe)
          $nsis = @(Get-ChildItem artifacts -Recurse -File -Filter '*_x64-setup.exe')
          if ($custom.Count -ne 1 -or $nsis.Count -ne 1) { throw 'Expected exactly two installers.' }
          foreach ($file in @($custom[0], $nsis[0])) {
            & ./scripts/ci/sign-windows.ps1 -Path $file.FullName -VerifyOnly
          }
  updater:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          run-id: 34578102488
          github-token: ${{ github.token }}
          name: openbitfun-v1.0.0-beta.2972-windows-x64-bundle
          path: artifacts
      - name: Verify downloaded updater signature
        env:
          OPENBITFUN_SIGNING_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          node scripts/write-minisign-public-key.mjs --out updater.pub
          mapfile -t installers < <(find artifacts -type f -name '*_x64-setup.exe')
          test "${#installers[@]}" -eq 1
          installer="${installers[0]}"
          base64 --decode "${installer}.sig" > updater.minisig
          minisign -Vm "$installer" -p updater.pub -x updater.minisig
