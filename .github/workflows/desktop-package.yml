name: Release Permission Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe draft release API permissions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = 'https://api.github.com/repos/wgqqqqq/BitFun'
          release = '/releases/386262223'
          sha = '4bc85ffeef113f8289595c9fd00f5510cb4a80fa'
          def probe(label, method, path, payload=None):
              req = urllib.request.Request(base + path, method=method,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28',
                           'Content-Type': 'application/json'})
              try:
                  response = urllib.request.urlopen(req, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              data = json.load(response)
              print(json.dumps({'probe': label, 'status': response.status,
                  'accepted_permissions': response.headers.get('X-Accepted-GitHub-Permissions'),
                  'request_id': response.headers.get('X-GitHub-Request-Id'),
                  'message': data.get('message'), 'errors': data.get('errors'),
                  'draft': data.get('draft'), 'target_commitish': data.get('target_commitish')}))
          probe('read-draft', 'GET', release)
          probe('patch-name-only', 'PATCH', release, {'name': 'OpenBitFun 1.0.0-beta'})
          probe('patch-draft-only', 'PATCH', release, {'draft': True})
          probe('patch-prerelease-only', 'PATCH', release, {'prerelease': False})
          probe('patch-latest-false', 'PATCH', release, {'make_latest': 'false'})
          probe('patch-target-same-sha', 'PATCH', release, {'target_commitish': sha})
          probe('patch-target-tag', 'PATCH', release, {'target_commitish': 'v1.0.0-beta'})
          probe('patch-target-main', 'PATCH', release, {'target_commitish': 'main'})
          probe('generate-notes', 'POST', '/releases/generate-notes', {'tag_name': 'v1.0.0-beta', 'target_commitish': sha})
          probe('patch-action-fields', 'PATCH', release, {'tag_name': 'v1.0.0-beta',
              'target_commitish': sha, 'name': 'OpenBitFun 1.0.0-beta',
              'draft': True, 'prerelease': False, 'make_latest': 'true'})
          probe('restore-draft-metadata', 'PATCH', release, {'target_commitish': sha, 'draft': True, 'make_latest': 'false'})
          PY
